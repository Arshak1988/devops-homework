<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOpsPath — From SSH to Kubernetes</title>
  <meta name="description" content="A hands-on DevOps course: SSH, Virtualization, Ansible, Docker, CI/CD, AWS, Terraform, Kubernetes and Monitoring." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Apply saved theme before first paint (no flash)
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>

  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a href="/" class="logo"><span class="logo-mark">&gt;_</span> devops<span class="accent">path</span><span class="logo-caret">█</span></a>
      <nav class="nav-links" id="navLinks">
        <a href="/" data-route="home">~/home</a>
        <a href="/topics" data-route="topics">~/topics</a>
        <a href="/journey" data-route="journey">~/journey</a>
        <a href="/play" data-route="play">~/play</a>
        <a href="/progress" data-route="progress">~/progress</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark / light mode" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Every page is rendered into here by the router in script.js -->
  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <p><span class="accent">$</span> echo "© <span id="year"></span> DevOpsPath"</p>
      <p class="muted">Built with HTML, CSS &amp; vanilla JavaScript</p>
    </div>
  </footer>

  <button class="to-top" id="toTop" aria-label="Back to top">↑</button>
  <div class="toast" id="toast" role="status"></div>

  
  <script src="/script.js"></script>
</body>
</html>
